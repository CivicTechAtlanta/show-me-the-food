# Zero-install development environment: `docker compose up` builds the image,
# prepares and seeds the SQLite database, and serves http://localhost:3000.
# The source tree is bind-mounted, so code edits on the host reload live.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - .:/rails
      # Gems persist across `docker compose up` runs.
      - bundle:/usr/local/bundle
      # Keep the container's SQLite databases out of the bind mount: SQLite
      # locking is unreliable on macOS/Windows bind mounts, and this avoids
      # clobbering a database created natively with bin/setup.
      - storage:/rails/storage

volumes:
  bundle:
  storage:
